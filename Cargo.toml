[package]
name = "environment-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Linux environment manager compatible with environment-runner"
license = "UNLICENSED"

[[bin]]
name = "environment-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.0", features = ["derive", "env", "string"] }
clap_complete = "4.6.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
http = "1.4.0"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
libc = "0.2.178"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "socket", "user"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-stdout = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics"] }
pbjson = "0.9.0"
prost = "0.14.4"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = ["gzip", "json", "multipart", "query", "rustls", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
tar = "0.4.44"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["codec", "io", "rt"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.16", features = ["xxh64"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.5"

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
assert_cmd = "2.1.1"
axum = { version = "0.8.9", features = ["ws"] }
insta = { version = "1.44.3", features = ["json"] }
predicates = "3.1.3"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
proptest = "1.9.0"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full", "visit"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
