syntax = "proto3";

package anthropic.sessions.tunnel.v1alpha;

option go_package = "github.com/anthropics/anthropic/api-go/environment-manager/gen/proto/anthropic/sessions/tunnel/v1alpha;tunnelv1alpha";

message Header {
  string name = 1;
  string value = 2;
}

message TunnelRequest {
  string session_id = 1;

  oneof payload {
    HTTPTunnelRequest http_request = 2;
    HTTPTunnelCancel http_cancel = 3;
    WSTunnelOpen ws_open = 4;
    WSTunnelMessage ws_message = 5;
    WSTunnelClose ws_close = 6;
  }
}

message TunnelResponse {
  oneof payload {
    HTTPTunnelResponseHeaders http_headers = 1;
    HTTPTunnelResponseChunk http_chunk = 2;
    HTTPTunnelResponseError http_error = 3;
    WSTunnelOpened ws_opened = 4;
    WSTunnelMessage ws_message = 5;
    WSTunnelClose ws_close = 6;
    WSTunnelError ws_error = 7;
  }
}

message HTTPTunnelRequest {
  string request_id = 1;
  int32 port = 2;
  string method = 3;
  string path = 4;
  repeated Header headers = 5;
  bytes body = 6;
}

message HTTPTunnelCancel {
  string request_id = 1;
}

message HTTPTunnelResponseHeaders {
  string request_id = 1;
  int32 status_code = 2;
  string status_text = 3;
  repeated Header headers = 4;
  uint32 sequence_number = 5;
}

message HTTPTunnelResponseChunk {
  string request_id = 1;
  bytes data = 2;
  bool is_final = 3;
  uint32 sequence_number = 4;
}

message HTTPTunnelResponseError {
  string request_id = 1;
  string error_message = 2;
}

message WSTunnelOpen {
  string tunnel_id = 1;
  int32 port = 2;
  string path = 3;
  repeated Header headers = 4;
  repeated string protocols = 5;
}

message WSTunnelOpened {
  string tunnel_id = 1;
  string protocol = 2;
}

message WSTunnelMessage {
  string tunnel_id = 1;
  bytes data = 2;
  bool is_binary = 3;
}

message WSTunnelClose {
  string tunnel_id = 1;
  int32 code = 2;
  string reason = 3;
}

message WSTunnelError {
  string tunnel_id = 1;
  string error_message = 2;
}
